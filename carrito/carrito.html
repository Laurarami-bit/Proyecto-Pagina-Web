
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Angelitos Con Amor</title>

    <style>
        body {
            color: black;
        }

        .topnav {
            display: flex;
            align-items: center;
            gap: 60px;
            background-color: rgb(255, 219, 228);
        }

        .topnav h1 {
            margin: 0;
        }

        .topnav a {
            text-decoration: none;
            color: black;
        }

        .banner {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .carrito {
            margin-left: auto;
            margin-right: 30px;
            font-size: 18px;
        }

        .contenedor-carrito {
            display: flex;
            justify-content: space-between;
            width: 90%;
            margin: 40px auto;
        }

        .mi-carrito {
            width: 60%;
        }

        .producto {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid gray;
            padding: 20px 0;
        }

        .producto img {
            width: 130px;
        }

        .info-producto h3 {
            margin: 0 0 20px 0;
        }

        .cantidad {
            background-color: rgb(230, 230, 230);
            padding: 5px 10px;
            margin-left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .cantidad button {
            background-color: transparent;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .resumen {
            width: 30%;
        }

        .linea-resumen {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }

        .total {
            font-weight: bold;
            font-size: 22px;
            border-top: 1px solid gray;
            padding-top: 15px;
        }

        .btn-comprar {
            width: 100%;
            background-color: rgb(74, 44, 51);
            color: black;
            padding: 15px;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-comprar:hover {
            background-color: rgb(60, 35, 40);
        }
    </style>
</head>

<body>

    <div class="topnav">

        <h1>ANGELITOS CON AMOR</h1>

        <a href="#Inicio"><h3>Inicio</h3></a>
        <a href="#productos"><h3>Productos</h3></a>
        <a href="#Nosotros"><h3>Nosotros</h3></a>
        <a href="#Contacto"><h3>Contacto</h3></a>

        <a class="carrito" href="#carrito">🛒 Carrito(2)</a>

    </div>

    <img class="banner" src="imagenes/banner1.png">

    <div class="contenedor-carrito">

        <div class="mi-carrito">

            <h2>🛒 Mi Carrito</h2>

            <div class="producto">

                <img src="imagenes/coche.jpg">

                <div class="info-producto">

                    <h3>Coche CITY V3</h3>

                    $500.000

                    <span class="cantidad">
                        <button onclick="cambiarCantidad(this, -1)">-</button>
                        <span class="numero">1</span>
                        <button onclick="cambiarCantidad(this, 1)">+</button>
                    </span>

                </div>

            </div>

            <div class="producto">

                <img src="imagenes/conjunto.jpg">

                <div class="info-producto">

                    <h3>
                        Conjunto + peluche
                        <br>
                        de apego bebé niño
                    </h3>

                    $199.990

                    <span class="cantidad">
                        <button onclick="cambiarCantidad(this, -1)">-</button>
                        <span class="numero">1</span>
                        <button onclick="cambiarCantidad(this, 1)">+</button>
                    </span>

                </div>

            </div>

        </div>

        <div class="resumen">

            <div class="linea-resumen">
                <p>Subtotal</p>
                <p>$699.990</p>
            </div>

            <div class="linea-resumen">
                <p><b>Calcular Envio</b></p>
                <p>$10.000</p>
            </div>

            <div class="linea-resumen total">
                <p>Total</p>
                <p>$709.990</p>
            </div>

            <button class="btn-comprar"
                onclick="alert('Compra realizada, gracias por confiar en Angelitos Con Amor!')">
                Finalizar Compra
            </button>

            <p style="text-align: center;">
                <b>Pago Seguro</b>
            </p>

        </div>

    </div>

</body>

</html>
