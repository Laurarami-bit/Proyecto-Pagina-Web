<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                body{
                    background-color:#f5e6d3 ;
                    background-image: url("f6109219-3844-4d15-ac1a-3cc098876799.jpg");
                    background-size: cover;
                    background-position: center;
                    background-repeat: no-repeat;
                }
                .login-container{ 
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    min-height: 100vh;

                }
                .logo-box img{ 
                    width: 400px;
                    margin-bottom: 20px;
                }
                .login-card{
                    background-color:#f4c9d1;
                    padding: 10px;
                    border-radius: 0px;
                    width: 350px;
                    text-align: center;

                }
                .input-group{ 
                    margin-bottom: 15px;
                    text-align: left;
                }
                .input-group label{
                    display: block;
                    margin-bottom: 5px;
                    font-weight: bold;
                    color: #555;
                }
                .input-group input{
                    width: 70%;
                    padding: 10px;
                    border: none;
                    border-radius: 0px;
                    background-color: #e8e8e8;
                    box-sizing: border-box;
                    display: block;
                    margin: 0 auto;

                }
                button{
                    width: 40%;
                    padding: 12px;
                    background-color: #f4d06f;
                    border: none;
                    border-radius: 8px;
                    font-weight: bold;
                    cursor: pointer;
                    margin-top: 10px;

                }
                a {
                    display: block;
                    margin-top: 15px;
                    font-size: 0.85rem;
                    color: #a67c7c;
                     text-decoration: none;

                }
                .icono-titulo{
                    font-size: 2.5rem;
                    
                    
                }

            </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-box">
            <img src="C:\Users\laura cristina\Desktop\login.html\WhatsApp Image 2026-08-28 at 8.34.15 AM.jpeg" alt="Angelitos con amor">
            
        </div>
        <div class="login-card">
            <h2><span class="icono-titulo">👥</span><br>INICIAR SESIÒN</h2>
            <div class="input-group">
                <input type="text" id="usuario" name="usuario" placeholder="👤 USUARIO">
            </div>
            <div class="input-group">
                <input type="password" id="clave" name="clave" placeholder="🔒 CONTRASEÑA">
            </div>
            <button type="submit">ACCESO</button>
            <a href="#">¿Haz Olviado Tu Contraseña?</a>
            </div>

        </div>

    </div> 

    
</body>
</html>
