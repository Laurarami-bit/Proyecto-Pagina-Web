<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angelitos con amor</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-image: url("WhatsApp Image 2026-08-29 at 4.08.19 PM.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .registro-container{
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px, 20px;
        }
        form{ 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 30px;
            width: 55%;
            max-width: 700px;
        }
        .encabenzado{
            text-align: center;
            margin-bottom: 20px;
        }
        .ancho{
            grid-column: 1/3;
        }
        .campo input{
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #e8e8e8;
            box-sizing: border-box;
            margin-top: 5px;
        }
        .terminos label{ 
            font-size: 0.55rem;
        }
        .icono-registro{
            font-size: 4rem;
        }
        .enlace-vista{
         grid-column: 1/3;
           display: block;
           text-align: center;
           font-size: 0.60rem;
           margin-top: 20px;
        }
        button{ 
            grid-column: 1/3;
            display: block;
            width: 50%;
            padding: 12px;
            margin: 0px auto 0;
        }
        .logo{ 
            width: 20%;
            position: absolute;
            top: 20px;
            right: 20px;
        }
        
    </style>
</head>
<body>
    <div class="registro-container">
        <span class="icono-registro">👤</span>
        <img src="C:\Users\laura cristina\Desktop\Vistageneral.html\logo.png" alt="Angelitos con amor" class="logo"> 
        <div class="encabezado">
            <h1>REGISTRO</h1>
            <p>CREA TU CUENTA</p>
        </div>
        <form>
            <div class="campo">
            <label for="nombre">👤 NOMBRE COMPLETO</label>
            <input type="text" id="nombre" placeholder="INGRESA TU NOMBRE">
            </div>
            <div class="campo">
                <label for="usuario">👤 CREA TU USUARIO </label>
                <input type="text" id="usuario" name="usuario" placeholder="CREA TU CUENTA">
            </div>
            <div class="campo ancho">
            <label for="correo"> ✉️CORREO ELECTRONICO</label>
            <input type="email" id="correo" name="correo" placeholder="laura@correo.com">
            </div>
            <div class="campo">
                <label for="telefono">📞 TELEFONO</label>
                <input type="tel" id="telefono" name="telefono" placeholder="INGRESA TU NUMERO">
            </div>
            <div class="campo">
            <label for="fecha">📅 FECHA DE NACIMIENTO</label>
            <input type="date" id="fecha" name="fecha" placeholder="dd/mm/aaaa">
            </div>
            <div class="campo">
                <label for="contrasena">🔒 CREA TU CONTRASEÑA</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="CREA TU CONTRASEÑA">
            </div>
            <div class="campo">
                <label for="contrasenacon">🔒 CONFIRMA TU CONTRASEÑA</label>
                <input type="password" id="contrasenacon" name="contrasenacon" placeholder="CONFIRMA TU CONTRASEÑA">
            </div>
            <div class="campo">
                <label for="direccion">🏠 INGRESA TU DIRECCIÒN</label>
                <input type="text" id="direccion" name="direccion" placeholder="INGRESA TU DIRECCIÒN">
            </div>
            <div class="campo">
                <label for="ciudad">🏙️ CIUDAD</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="CIUDAD">
            </div>
            <div class="terminos">
                <label for="terminos">ACEPTO LOS TERMINOS Y CONDICIONES Y POLITICAS DE PRIVACIDAD</label>
                <input type="checkbox" id="terminos" name="terminos">
            </div>
            <button type="submit">CREAR CUENTA</button>
            <a href="#" class="enlace-vista">¿YA TIENES CUENTA?, INICIA SECCIÒN</a>
        </form>

    </div>
    
</body>
</html>
